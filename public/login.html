<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign in · Announcement Sender</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="login">
  <form class="panel" id="f">
    <h1>Announcement Sender</h1>
    <p class="sub">Enter the dashboard password.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required autofocus>
    <p class="err" id="err" role="alert"></p>
    <button class="primary" type="submit">Sign in</button>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    const d = await r.json();
    if (r.ok) location.href = '/'; else err.textContent = d.error || 'Could not sign in.';
  } catch { err.textContent = 'The server is not responding. Is it running?'; }
});
</script>
</body>
</html>
